<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualités d'Eyguières</title>
    <style>
        /* Reset CSS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
        }

        header {
            background-color: #34495e;
            color: #fff;
            padding: 1.5rem 1rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 {
            font-size: 2rem;
        }

        nav {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            padding: 0.5rem 0;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 1.5rem;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #f39c12;
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 1rem;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .article-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
        }

        .article-card {
            flex: 1 1 calc(33.333% - 2rem);
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .article-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .article-card h2 {
            font-size: 1.25rem;
            margin: 1rem;
            color: #2c3e50;
        }

        .article-card p {
            margin: 0 1rem 1rem;
            color: #555;
        }

        .read-more {
            display: block;
            text-align: center;
            background-color: #e74c3c;
            color: #fff;
            text-decoration: none;
            padding: 0.8rem;
            border-radius: 0 0 8px 8px;
            transition: background-color 0.3s ease;
        }

        .read-more:hover {
            background-color: #c0392b;
        }

        footer {
            text-align: center;
            padding: 1rem;
            background-color: #34495e;
            color: white;
            margin-top: 2rem;
        }

        @media (max-width: 768px) {
            .article-card {
                flex: 1 1 calc(50% - 1rem);
            }
        }

        @media (max-width: 480px) {
            .article-card {
                flex: 1 1 100%;
            }

            nav a {
                margin: 0 0.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Actualités d'Eyguières</h1>
        <p>Restez informé avec les nouvelles locales</p>
    </header>

    <nav>
        <a href="#">Accueil</a>
        <a href="#">Société</a>
        <a href="#">Culture</a>
        <a href="#">Contact</a>
    </nav>

    <main>
        <section class="article-preview" id="articles-container">
            <!-- Articles dynamically loaded here -->
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Actualités d'Eyguières. Tous droits réservés.</p>
    </footer>

    <script>
        const articles = [
            {
                id: 1,
                title: "Travaux sur la route principale",
                content: "Des travaux majeurs sont prévus la semaine prochaine sur la route principale.",
                fullContent: "Des travaux majeurs sont prévus la semaine prochaine sur la route principale. Préparez-vous à des perturbations importantes.",
                image: "https://via.placeholder.com/400x180",
                hasButton: false
            },
            {
                id: 2,
                title: "Crime non résolu au Chemin des Magnanons",
                content: "Un mystère plane sur le bâtiment B du Chemin des Magnanons à Eyguières.",
                fullContent: "Un mystère plane sur le bâtiment B du Chemin des Magnanons à Eyguières. Plusieurs habitants rapportent des événements étranges, mais aucune réponse claire n’a été trouvée.",
                image: "https://via.placeholder.com/400x180",
                hasButton: true
            },
            {
                id: 3,
                title: "Fête annuelle au centre-ville",
                content: "Rejoignez-nous pour la fête annuelle avec des activités pour toute la famille.",
                fullContent: "Rejoignez-nous pour la fête annuelle au centre-ville avec des concerts, des jeux, et bien plus encore.",
                image: "https://via.placeholder.com/400x180",
                hasButton: false
            }
        ];

        const articlesContainer = document.getElementById('articles-container');

        function loadArticles() {
            articles.forEach(article => {
                const articleCard = document.createElement('div');
                articleCard.classList.add('article-card');
                articleCard.innerHTML = `
                    <img src="${article.image}" alt="${article.title}">
                    <h2>${article.title}</h2>
                    <p>${article.content}</p>
                    <a href="#" class="read-more" onclick="viewArticle(${article.id})">Lire l'article</a>
                `;
                articlesContainer.appendChild(articleCard);
            });
        }

        function viewArticle(id) {
            const article = articles.find(a => a.id === id);
            if (article) {
                articlesContainer.innerHTML = `
                    <article>
                        <h2>${article.title}</h2>
                        <img src="${article.image}" alt="${article.title}" style="width:100%; margin-bottom: 1rem;">
                        <p>${article.fullContent}</p>
                        ${article.hasButton ? '<a href="#" class="btn-enqueter" onclick="startInvestigation()">Résoudre ce crime</a>' : ''}
                        <br><br><a href="#" onclick="goBack()">Retour</a>
                    </article>
                `;
            }
        }

        function goBack() {
            articlesContainer.innerHTML = '';
            loadArticles();
        }

        function startInvestigation() {
            alert("L'enquête commence ! Suivez les indices pour découvrir la vérité.");
            window.location.href = "investigation.html";
        }

        loadArticles();
    </script>
</body>
</html>
